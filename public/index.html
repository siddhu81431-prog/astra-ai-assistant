<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="/manifest.json">
<title>Astra AI Assistant</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="app">
  <header><div class="orb">✦</div><div><h1>Astra</h1><p>Your personal AI assistant</p></div><button id="clear" aria-label="Clear chat">⌫</button></header>
  <section id="chat" class="chat">
    <div class="bubble astra">Hello! I’m Astra ✨<br>How can I help you today?</div>
  </section>
  <div class="chips">
    <button>Plan my day</button><button>Write a message</button><button>Help me learn</button>
  </div>
  <form id="form"><input id="input" autocomplete="off" placeholder="Ask Astra anything…"><button>➤</button></form>
</main>
<script src="/app.js"></script>
</body>
</html>
